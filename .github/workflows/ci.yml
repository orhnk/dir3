name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev,examples]"

      - name: Lint
        run: ruff check src tests examples

      - name: Test
        run: python -m pytest

      - name: Smoke (full-offline plan)
        run: python -m dir3 examples/ramadan.py --offline --until 3

      - name: Smoke (holidays & workdays, offline)
        run: python -m dir3 examples/public_holidays_week.py --offline --until 14