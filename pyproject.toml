[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dir3"
version = "0.1.0"
description = "Das Leben zeitlich programmieren - weich, anker-basiert, krass konfigurierbar"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dir3" }]
dependencies = [
    "requests>=2.31",
    "tzdata>=2024.1",
    "httpx>=0.27",
    "aiogoogle>=5",
    "hijridate>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
examples = ["holidays>=0.40"]

[project.scripts]
dir3 = "dir3.cli:main"
dir3-serve = "dir3.server:serve_main"
dir3-export = "dir3.export:export_main"
dir3-gcal-setup = "dir3.gcal_setup:main"
dir3-recipes = "dir3.recipe_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dir3 = ["py.typed", "phone_ui/*", "phone_ui/vendor/*", "phone_ui/vendor/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]